apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-v3-2-vllm
  labels:
    app: deepseek-v3-2-vllm
  namespace: llm-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepseek-v3-2-vllm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: deepseek-v3-2-vllm
        engine: vllm
    spec:
      containers:
      - args:
        - |
          mkdir -p /tmp/scratch-space/DeepSeek-V3.2
          cp -r /proj-tango-pvc/models/DeepSeek-V3.2/* /tmp/scratch-space/DeepSeek-V3.2/
          sleep infinity
        command:
        - /bin/bash
        - -c
        image: vllm/vllm-openai:v0.13.0
        imagePullPolicy: IfNotPresent
        name: deepseek-v3-2-vllm
        ports:
        - containerPort: 30000
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "32"
            memory: 1600G
            nvidia.com/gpu: "8"
        securityContext:
          capabilities:
            add:
            - SYS_PTRACE
            - SYS_ADMIN
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /tmp/scratch-space
          name: scratch-space
        - mountPath: /proj-tango-pvc
          name: proj-tango-pvc
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 800G
        name: dshm
      - hostPath:
          path: /mnt/nvme_cache/scratch-space/llm-serving
          type: DirectoryOrCreate
        name: scratch-space
      - name: proj-tango-pvc
        persistentVolumeClaim:
          claimName: proj-tango-pvc
