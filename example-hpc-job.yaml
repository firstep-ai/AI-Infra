# HPC 集群作业配置示例
# 使用 Python 3.13 + CUDA 12.6 镜像

apiVersion: v1
kind: Job
metadata:
  name: my-gpu-job
  namespace: your-namespace

spec:
  # 使用构建的镜像
  image: gcr.io/mde-cloud/image-repo/your-project:python3.13-cu126-v1.0
  
  # 资源配置
  resources:
    requests:
      cpu: "8"
      memory: "32Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "16"
      memory: "64Gi"
      nvidia.com/gpu: "1"
  
  # 环境变量
  env:
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
    - name: PYTHONUNBUFFERED
      value: "1"
  
  # 工作目录
  workingDir: /workspace
  
  # 执行命令
  command:
    - python3
    - your_script.py
  
  # 挂载卷（可选）
  volumeMounts:
    - name: data-storage
      mountPath: /data
  
  volumes:
    - name: data-storage
      persistentVolumeClaim:
        claimName: your-data-pvc

